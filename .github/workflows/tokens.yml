# Checks phalcon/css/tokens.css, phalcon/css/code-theme.json and
# phalcon/css/common.css, the design tokens, the code theme and the shared
# header and footer that every Phalcon site uses, and phalcon/tools/, the
# checks and the refresh that every site runs on them, when a file or its
# checks change. The files change only by hand, so this workflow makes no
# commit. Consumers read the files from https://assets.phalcon.io/phalcon/.
name: Check design tokens

on:
  push:
    branches:
      - master
    paths:
      - phalcon/css/tokens.css
      - phalcon/css/code-theme.json
      - phalcon/css/common.css
      - phalcon/tools/**
      - _tokens/**
      - tests/tokens.php
      - tests/*.test.mjs
      - .github/workflows/tokens.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4

      - name: Check the tokens, the code theme and common.css
        run: php tests/tokens.php

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check the shared design tools
        run: node --test "tests/*.test.mjs"
