# Rebuilds the roster in a file of the calling repository (README.md by
# default) from https://assets.phalcon.io/phalcon/sponsors.json. When the file
# changed, it opens a pull request to the branch of the run. The file must
# have the <!-- backers:start --> and <!-- backers:end --> markers. The script
# changes only the text between them.
#
# A repository calls this workflow on a schedule, after the roster job of this
# repository (04:17 UTC). README.md shows a caller.
#
# The script comes from the commit of this workflow file, so a caller that
# pins a SHA runs the script of that SHA. The push and the pull request use
# the GITHUB_TOKEN of the calling repository, so they do not start other
# workflows there.
name: Update backers

on:
  workflow_call:
    inputs:
      file:
        description: The file with the roster markers, from the root of the repository.
        type: string
        default: README.md

permissions:
  contents: write
  pull-requests: write

jobs:
  backers:
    runs-on: ubuntu-latest

    concurrency:
      group: backers
      cancel-in-progress: false

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository

      - name: Checkout the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: assets
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4

      - name: Rebuild the roster
        # The script exits non-zero when the download fails, the roster is
        # not correct, or the markers are missing. The run then fails and the
        # file does not change.
        env:
          BACKERS_FILE: ${{ inputs.file }}
        run: php assets/scripts/updateBackers.php "repository/${BACKERS_FILE}"

      - name: Open a pull request when the roster changed
        # The branch of the run is protected, so the change goes to one
        # branch and one pull request. A new change replaces the change of an
        # earlier run, so the open pull request always has the newest roster.
        working-directory: repository
        env:
          BACKERS_FILE: ${{ inputs.file }}
          BASE_BRANCH: ${{ github.ref_name }}
          BRANCH: backers-roster-update
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- "${BACKERS_FILE}"

          open=$(gh pr list --head "${BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq 'length')

          if git diff --cached --quiet -- "${BACKERS_FILE}"; then
            echo "No change to ${BACKERS_FILE}"

            # The roster is the same as on the base branch again, so the open
            # pull request of an earlier run is out of date.
            if [ "${open}" != "0" ]; then
              gh pr close "${BRANCH}" --delete-branch --comment "The roster is the same as on ${BASE_BRANCH} again."
            fi

            exit 0
          fi

          # The open pull request already has this roster, so push nothing.
          if [ "${open}" != "0" ] \
            && git fetch --depth=1 origin "${BRANCH}" \
            && git diff --cached --quiet FETCH_HEAD -- "${BACKERS_FILE}"; then
            echo "The open pull request already has this roster"
            exit 0
          fi

          git config user.name niden
          git config user.email nikos@niden.net
          git switch -C "${BRANCH}"
          git commit -m "Updating the backers roster"
          git push --force origin "${BRANCH}"

          if [ "${open}" = "0" ]; then
            gh pr create --base "${BASE_BRANCH}" --head "${BRANCH}" \
              --title "Updating the backers roster" \
              --body "The backers workflow rebuilt the roster from https://assets.phalcon.io/phalcon/sponsors.json."
          fi
