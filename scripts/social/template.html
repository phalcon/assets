<!doctype html>
<!--
    The social card of a Phalcon repository (1280 x 640, the size of a GitHub social
    preview). scripts/social/render.mjs fills the fields from cards.json, puts in
    the design tokens (public/phalcon/css/tokens.css) and the falcon
    (public/phalcon/images/svg/falcon.svg), and writes the PNG.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>{{tokens}}</style>
<style>
    html, body { margin: 0; }
    .card {
        background:
            radial-gradient(circle at 78% 52%, color-mix(in srgb, var(--ph-brand-400) 16%, transparent) 0, transparent 40%),
            var(--ph-night-950);
        box-sizing: border-box;
        color: var(--ph-mist-100);
        font-family: var(--ph-font-sans);
        height: 640px;
        overflow: hidden;
        padding: 72px 80px;
        position: relative;
        width: 1280px;
    }
    .kicker {
        color: var(--ph-dark-kicker);
        font-family: var(--ph-font-mono);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
    }
    h1 {
        font-size: 108px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        margin: 26px 0 0;
    }
    h1 .name { display: inline-block; white-space: nowrap; }
    h1 .tagline { color: var(--ph-dark-muted); display: block; font-size: 54px; letter-spacing: -0.03em; margin-top: 12px; max-width: 600px; }
    p { color: var(--ph-mist-300); font-size: 28px; line-height: 1.4; margin: 30px 0 0; max-width: 640px; }
    .pills { display: flex; gap: 14px; margin-top: 34px; }
    .pill {
        border: 1px solid var(--ph-dark-border);
        border-radius: 4px;
        color: var(--ph-dark-accent);
        font-family: var(--ph-font-mono);
        font-size: 20px;
        font-weight: 600;
        padding: 10px 16px;
    }
    .pill + .pill { color: var(--ph-dark-muted); }
    .url { bottom: 56px; color: var(--ph-dark-kicker); font-family: var(--ph-font-mono); font-size: 22px; left: 80px; position: absolute; }
    .falcon { height: 470px; position: absolute; right: 60px; top: 86px; }
</style>
</head>
<body>
<div class="card">
    <div class="kicker">{{kicker}}</div>
    <h1><span class="name">{{name}}</span><span class="tagline">{{tagline}}</span></h1>
    <p>{{text}}</p>
    <div class="pills">{{pills}}</div>
    <div class="url">{{url}}</div>
    <img class="falcon" src="{{falcon}}" alt="">
</div>
<script>
    // A long name gets smaller until it fits beside the falcon. In a block: render.mjs
    // gives each card to the same page, and a global const would be declared twice.
    {
        const name = document.querySelector('h1 .name');

        for (let size = 108; name.scrollWidth > 620 && size > 60; size -= 2) {
            name.style.fontSize = `${size - 2}px`;
        }
    }
</script>
</body>
</html>
